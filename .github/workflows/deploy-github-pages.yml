name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          if find projects -name '*.spec.ts' -print -quit | grep -q .; then
            npm test
          else
            echo "Aún no hay pruebas unitarias (Paso 5 pendiente)."
          fi

      - name: Build library
        run: npm run build:lib

      - name: Build showcase app
        run: npm run build:app -- --base-href "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages SPA fallback
        run: cp ./dist/storage-manager-showcase/browser/index.html ./dist/storage-manager-showcase/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/storage-manager-showcase/browser

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
