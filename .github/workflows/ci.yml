name: CI

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop', 'main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build showcase app
        run: npm run build:app

      - name: Generate technical documentation
        run: npm run compodoc

      - name: Run unit tests
        run: npm test
